<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Denisa, be my Valentine? 💘</title>
  <meta name="theme-color" content="#ff4d6d" />
  <style>
    :root{
      --a:#ff4d6d;
      --b:#b5179e;
      --c:#7c3aed;

      --ink:#0b1020;
      --muted: rgba(11,16,32,.74);

      --glass: rgba(255,255,255,.80);
      --glass2: rgba(255,255,255,.55);
      --stroke: rgba(255,255,255,.35);

      --shadow: 0 30px 90px rgba(0,0,0,.28);
      --shadow2: 0 16px 40px rgba(0,0,0,.18);

      --yes1:#34d399; --yes2:#22c55e;
      --no1:#fb7185;  --no2:#ef4444;

      --r1: 30px;
      --r2: 36px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--ink);
      overflow:hidden;

      background:
        radial-gradient(1100px 800px at 15% 15%, rgba(255,214,224,.82) 0%, transparent 60%),
        radial-gradient(900px 700px at 85% 20%, rgba(255,229,241,.74) 0%, transparent 60%),
        radial-gradient(900px 700px at 75% 90%, rgba(220,190,255,.30) 0%, transparent 58%),
        linear-gradient(135deg, var(--a), var(--b) 55%, var(--c));
      animation: bgShift 10s ease-in-out infinite alternate;
    }
    @keyframes bgShift{
      from{ filter: hue-rotate(0deg) saturate(1.05); }
      to  { filter: hue-rotate(10deg) saturate(1.15); }
    }

    /* ===== BIG “I LOVE U SO MUCH” BACKGROUND (VISIBLE) ===== */
    .bgText{
      position:fixed; inset:0;
      pointer-events:none;
      z-index:0;
      overflow:hidden;
    }
    .bgText .layer{
      position:absolute; inset:-120px;
      transform: rotate(-14deg) scale(1.08);
      opacity: 1;
      mix-blend-mode: overlay;
      will-change: transform;
      filter: drop-shadow(0 10px 30px rgba(0,0,0,.10));
    }
    .bgText .layer::before{
      content:
        "I LOVE U SO MUCH   •   I LOVE U SO MUCH   •   I LOVE U SO MUCH   •   I LOVE U SO MUCH   •   I LOVE U SO MUCH   •   I LOVE U SO MUCH   •   I LOVE U SO MUCH   •   I LOVE U SO MUCH   •   I LOVE U SO MUCH";
      position:absolute; inset:0;
      white-space:pre;
      font-weight:1000;
      letter-spacing:.18em;
      line-height:1.95;
      font-size: clamp(22px, 4.2vw, 52px); /* bigger */
      color: rgba(255,255,255,.46);         /* brighter */
      text-transform:uppercase;
      animation: textDrift 9s linear infinite;
    }
    @keyframes textDrift{
      from{ transform: translate3d(0,0,0); }
      to  { transform: translate3d(-18%, -10%, 0); }
    }

    /* Giant centered phrase */
    .bgText .giant{
      position:absolute;
      left:50%; top:50%;
      transform: translate(-50%,-50%) rotate(-12deg);
      font-weight:1000;
      letter-spacing:.08em;
      text-transform:uppercase;
      font-size: clamp(54px, 10.8vw, 140px);
      line-height:1.02;
      white-space:nowrap;
      color: rgba(255,255,255,.22);
      text-shadow: 0 18px 60px rgba(0,0,0,.14);
      animation: giantFloat 6.5s ease-in-out infinite;
    }
    .bgText .giant span{
      background: linear-gradient(90deg, rgba(255,255,255,.18), rgba(255,255,255,.42), rgba(255,255,255,.18));
      -webkit-background-clip:text; background-clip:text;
      color: transparent;
    }
    @keyframes giantFloat{
      0%,100%{ transform: translate(-50%,-50%) rotate(-12deg) translateY(0); }
      50%{ transform: translate(-50%,-50%) rotate(-12deg) translateY(-12px); }
    }

    /* soft moving light */
    .light{
      position:fixed; inset:-45%;
      z-index:0; pointer-events:none;
      background: radial-gradient(closest-side, rgba(255,255,255,.22), transparent 70%);
      filter: blur(12px);
      animation: lightMove 9s ease-in-out infinite;
      mix-blend-mode: soft-light;
    }
    @keyframes lightMove{
      0%,100%{ transform: translate(-8%, -6%); }
      50%{ transform: translate(8%, 6%); }
    }

    /* hearts */
    .hearts{
      position:fixed; inset:0;
      pointer-events:none;
      z-index:1;
      overflow:hidden;
      filter: drop-shadow(0 10px 14px rgba(0,0,0,.18));
    }
    .heart{
      position:absolute;
      transform: translate(-50%, 0);
      opacity:.9;
      user-select:none;
      will-change: transform, opacity;
      animation: floatUp linear forwards;
      font-size: clamp(14px, 2.6vw, 30px);
    }
    @keyframes floatUp{
      from{ transform: translate(-50%, 30px) scale(.9); opacity:0; }
      10%{ opacity:.95; }
      to{ transform: translate(-50%, -120vh) scale(1.25); opacity:0; }
    }

    /* layout */
    .wrap{
      position:relative;
      z-index:2;
      height:100%;
      display:grid;
      place-items:center;
      padding:22px;
    }
    .frame{
      width:min(820px, 96vw);
      padding:16px;
      border-radius: var(--r2);
      background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.06));
      border:1px solid rgba(255,255,255,.22);
      backdrop-filter: blur(14px);
      box-shadow: 0 40px 150px rgba(0,0,0,.20);
    }
    .card{
      border-radius: var(--r1);
      background: var(--glass);
      border:1px solid rgba(0,0,0,.06);
      box-shadow: var(--shadow);
      overflow:hidden;
      position:relative;
      isolation:isolate;
    }
    .glow{
      position:absolute;
      inset:-60% -30% auto -30%;
      height:340px;
      background: radial-gradient(closest-side, rgba(255,77,109,.42), transparent 70%);
      pointer-events:none;
      z-index:-1;
    }

    .header{
      padding:22px 22px 8px;
      display:flex;
      justify-content:center;
    }
    .badge{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:10px 14px;
      border-radius:999px;
      background: rgba(255, 77, 109, .12);
      border: 1px solid rgba(255, 77, 109, .25);
      font-weight:1000;
      letter-spacing:.2px;
    }

    .content{
      padding: 0 22px 18px;
      text-align:center;
    }
    .title{
      margin:14px 0 8px;
      font-size: clamp(30px, 5.2vw, 60px);
      line-height:1.02;
      font-weight:1000;
      letter-spacing:-.02em;
    }

    .subtitle{
      margin:0 auto 16px;
      max-width:60ch;
      font-size: clamp(14px, 2.2vw, 18px);
      color: var(--muted);
      line-height:1.55;
    }
    .type{
      display:inline-block;
      border-right: 2px solid rgba(11,16,32,.35);
      padding-right:6px;
      animation: caret 1.0s steps(1) infinite;
    }
    @keyframes caret{ 50%{ border-right-color: transparent; } }

    .inputs{
      display:flex;
      gap:12px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top:12px;
    }
    .pill{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:10px 12px;
      border-radius:999px;
      background:#fff;
      border:1px solid rgba(0,0,0,.08);
      box-shadow: 0 8px 18px rgba(0,0,0,.08);
      font-weight:900;
      min-width: 250px;
    }
    .pill label{ opacity:.65; font-weight:1000; }
    .pill input{
      border:none; outline:none;
      font: inherit;
      width: 14ch;
      text-align:right;
      background:transparent;
    }

    .hint{
      margin-top:10px;
      font-size:12px;
      opacity:.62;
    }

    .actions{
      display:flex;
      justify-content:center;
      gap:14px;
      margin:18px 0 8px;
      min-height:74px;
      position:relative;
    }
    button{
      border:none;
      cursor:pointer;
      font-weight:1000;
      border-radius: 18px;
      padding:15px 18px;
      font-size:16px;
      transition: transform .12s ease, filter .12s ease, box-shadow .12s ease;
      box-shadow: var(--shadow2);
      user-select:none;
      touch-action: manipulation;
    }
    button:active{ transform: translateY(1px) scale(.99); }
    .yes{
      background: linear-gradient(135deg, var(--yes1), var(--yes2));
      color:white;
      position:relative;
      overflow:hidden;
    }
    .yes::after{
      content:"";
      position:absolute;
      inset:-60% -30%;
      background: radial-gradient(closest-side, rgba(255,255,255,.48), transparent 60%);
      transform: translateX(-40%);
      opacity:.55;
      animation: yesShine 2.6s ease-in-out infinite;
      pointer-events:none;
    }
    @keyframes yesShine{
      0%,100%{ transform: translateX(-45%); }
      50%{ transform: translateX(45%); }
    }
    .no{
      background: linear-gradient(135deg, var(--no1), var(--no2));
      color:white;
      position:relative;
    }
    .yes:hover,.no:hover{ filter:brightness(1.02); transform: translateY(-1px); }

    .footer{
      padding:14px 18px 18px;
      display:flex;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
      border-top:1px solid rgba(0,0,0,.06);
      background: rgba(255,255,255,.55);
      font-size:12px;
      opacity:.78;
    }

    /* modal */
    .overlay{
      position:fixed; inset:0;
      display:none;
      place-items:center;
      background: rgba(0,0,0,.45);
      backdrop-filter: blur(10px);
      z-index:50;
      padding:22px;
    }
    .overlay.show{ display:grid; }
    .modal{
      width:min(760px, 96vw);
      border-radius: 28px;
      background:#fff;
      box-shadow: var(--shadow);
      border: 1px solid rgba(0,0,0,.08);
      padding: 24px 22px;
      text-align:center;
      position:relative;
      overflow:hidden;
    }
    .modal::before{
      content:"";
      position:absolute; inset:-70px -70px auto -70px;
      height:260px;
      background: radial-gradient(closest-side, rgba(181,23,158,.22), transparent 70%);
      pointer-events:none;
    }
    .big{
      font-size: clamp(30px, 5vw, 56px);
      margin:0 0 10px;
      font-weight:1000;
      letter-spacing:-.02em;
    }
    .msg{
      margin:0 auto 16px;
      max-width:60ch;
      opacity:.90;
      line-height:1.55;
      color: rgba(11,16,32,.82);
      font-size: clamp(14px, 2.2vw, 18px);
    }
    .close{
      background:#111827;
      color:white;
      padding:12px 16px;
      border-radius:16px;
    }

    /* confetti canvas */
    canvas#confetti{
      position:fixed; inset:0;
      pointer-events:none;
      z-index:60;
    }

    @media (max-width:420px){
      .pill{ min-width: 92%; }
      .actions{ gap:10px; }
      button{ padding:14px 16px; }
    }
  </style>
</head>
<body>
  <div class="bgText" aria-hidden="true">
    <div class="layer"></div>
    <div class="giant"><span>I LOVE U SO MUCH</span> 💗</div>
  </div>
  <div class="light" aria-hidden="true"></div>

  <div class="hearts" id="hearts" aria-hidden="true"></div>
  <canvas id="confetti" width="0" height="0" aria-hidden="true"></canvas>

  <div class="wrap">
    <div class="frame">
      <div class="card">
        <div class="glow"></div>

        <div class="header">
          <div class="badge">💌 Becher → Denisa</div>
        </div>

        <div class="content">
          <h1 class="title">Denisa, will you be my Valentine? 💘</h1>
          <p class="subtitle"><span class="type" id="typeText"></span></p>

          <div class="inputs">
            <div class="pill"><label>From</label><input id="fromName" value="Becher" /></div>
            <div class="pill"><label>To</label><input id="toName" value="Denisa" /></div>
          </div>

          <div class="hint">Tap anywhere for little hearts ✨ (and try the “No” button 😄)</div>

          <div class="actions">
            <button class="yes" id="yesBtn">Yes! 💖</button>
            <button class="no" id="noBtn">No 🙈</button>
          </div>
        </div>

        <div class="footer">
          <span>Made with ❤️</span><span>•</span><span>Distance can’t stop cute moments</span>
        </div>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="modal">
      <h2 class="big">YAAAY! 🥰💞</h2>
      <p class="msg" id="msgText"></p>
      <button class="close" id="closeBtn">Send me a kiss 😘</button>
    </div>
  </div>

  <script>
    // Parallax the background text slightly (pro effect)
    const bgLayer = document.querySelector(".bgText .layer");
    window.addEventListener("pointermove", (e) => {
      const x = (e.clientX / window.innerWidth - 0.5) * 16;
      const y = (e.clientY / window.innerHeight - 0.5) * 12;
      bgLayer.style.transform = `rotate(-14deg) scale(1.08) translate(${x}px, ${y}px)`;
    });

    // Typewriter lines
    const typeEl = document.getElementById("typeText");
    const lines = [
      "You are the best 💗 — I made this page just for you.",
      "I love u so much… even distance can’t change that.",
      "Press “Yes” and make me the happiest guy 😌💘"
    ];
    let L=0, i=0, del=false;
    function tick(){
      const t = lines[L];
      if(!del){
        i++;
        typeEl.textContent = t.slice(0,i);
        if(i>=t.length){ del=true; setTimeout(tick, 1100); return; }
      }else{
        i--;
        typeEl.textContent = t.slice(0,i);
        if(i<=0){ del=false; L=(L+1)%lines.length; }
      }
      setTimeout(tick, del?28:38);
    }
    tick();

    // Hearts
    const heartsLayer = document.getElementById("hearts");
    const heartChars = ["💗","💖","💘","💝","💞","💕","❤️","🫶"];
    function spawnHeart({x=null,y=null,big=false}={}){
      const el=document.createElement("div");
      el.className="heart";
      el.textContent=heartChars[Math.floor(Math.random()*heartChars.length)];
      const left=x ?? (Math.random()*window.innerWidth);
      const startY=y ?? (window.innerHeight+30);
      el.style.left=left+"px";
      el.style.top=startY+"px";
      el.style.fontSize=big?"36px":"";
      const dur=(big?3.8:5.2)+Math.random()*3.0;
      el.style.animationDuration=dur+"s";
      el.style.opacity=(0.55+Math.random()*0.4).toFixed(2);
      heartsLayer.appendChild(el);
      setTimeout(()=>el.remove(), dur*1000+250);
    }
    setInterval(()=>spawnHeart(), 220);

    function burst(cx,cy){
      for(let k=0;k<32;k++){
        setTimeout(()=>{
          const jx=cx+(Math.random()-0.5)*340;
          const jy=cy+(Math.random()-0.5)*160;
          spawnHeart({x:jx,y:jy,big:Math.random()>0.72});
        }, k*14);
      }
    }
    window.addEventListener("click",(e)=>{
      if(!document.getElementById("overlay").classList.contains("show")){
        spawnHeart({x:e.clientX,y:e.clientY,big:Math.random()>0.84});
      }
    },{capture:true});

    // No button dodge
    const noBtn=document.getElementById("noBtn");
    function moveNo(){
      const pad=14;
      const r=noBtn.getBoundingClientRect();
      const maxX=window.innerWidth-r.width-pad;
      const maxY=window.innerHeight-r.height-pad;
      const x=Math.max(pad, Math.random()*maxX);
      const y=Math.max(pad, Math.random()*maxY);
      noBtn.style.position="fixed";
      noBtn.style.left=x+"px";
      noBtn.style.top=y+"px";
      noBtn.style.zIndex=40;
    }
    noBtn.addEventListener("mouseenter", moveNo);
    noBtn.addEventListener("touchstart",(e)=>{e.preventDefault();moveNo();},{passive:false});
    noBtn.addEventListener("click", moveNo);

    // Confetti (white, clean)
    const canvas=document.getElementById("confetti");
    const ctx=canvas.getContext("2d");
    let conf=[], raf=null;
    function resize(){
      canvas.width=window.innerWidth*devicePixelRatio;
      canvas.height=window.innerHeight*devicePixelRatio;
      canvas.style.width=window.innerWidth+"px";
      canvas.style.height=window.innerHeight+"px";
      ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    }
    window.addEventListener("resize", resize); resize();

    function confettiStart(){
      conf=[];
      for(let i=0;i<200;i++){
        conf.push({
          x:Math.random()*window.innerWidth,
          y:-30-Math.random()*window.innerHeight*0.4,
          w:4+Math.random()*7,
          h:6+Math.random()*10,
          vx:-2+Math.random()*4,
          vy:2+Math.random()*5,
          r:Math.random()*Math.PI,
          vr:(-0.2+Math.random()*0.4),
          life:150+Math.random()*90
        });
      }
      if(raf) cancelAnimationFrame(raf);
      loop();
      setTimeout(()=>{
        if(raf) cancelAnimationFrame(raf);
        raf=null;
        ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
      }, 3600);
    }
    function loop(){
      ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
      for(const p of conf){
        p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.vy*=1.01; p.life-=1;
        ctx.save();
        ctx.translate(p.x,p.y);
        ctx.rotate(p.r);
        ctx.globalAlpha=Math.max(0, Math.min(1, p.life/230));
        ctx.fillStyle="rgba(255,255,255,.95)";
        ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
        ctx.restore();
      }
      conf = conf.filter(p=>p.life>0 && p.y < window.innerHeight+60);
      raf=requestAnimationFrame(loop);
    }

    // YES + modal
    const yesBtn=document.getElementById("yesBtn");
    const overlay=document.getElementById("overlay");
    const closeBtn=document.getElementById("closeBtn");
    const fromName=document.getElementById("fromName");
    const toName=document.getElementById("toName");
    const msgText=document.getElementById("msgText");

    yesBtn.addEventListener("click",()=>{
      const r=yesBtn.getBoundingClientRect();
      burst(r.left+r.width/2, r.top+r.height/2);
      confettiStart();

      const from=(fromName.value||"Becher").trim();
      const to=(toName.value||"Denisa").trim();
      msgText.textContent =
        msgText.innerHTML = `
<b>Denisa 💗</b><br><br>

You are my beloved girlfriend 💕💕<br>
but you are also my best friend 💑<br><br>

my love ♥️<br>
my heart 💗🤍<br>
my gift 🎁<br>
my future ♾️<br>
my motivation 🤩<br>
my princess 👑<br>
my home 😍<br>
my safe place 😘<br><br>

I love you so much and happy Valentine Day ma baby 🥰<br><br>

<b>— Becher 💘</b>
`;
      
      overlay.classList.add("show");
      overlay.setAttribute("aria-hidden","false");
    });

    closeBtn.addEventListener("click",()=>{
      overlay.classList.remove("show");
      overlay.setAttribute("aria-hidden","true");
      burst(window.innerWidth/2, window.innerHeight/2);
    });

    overlay.addEventListener("click",(e)=>{
      if(e.target===overlay) closeBtn.click();
    });
  </script>
</body>
</html>

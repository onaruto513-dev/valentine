<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Denisa, will you be my Valentine? 💘</title>
  <style>
    :root{
      --pink:#ff4d6d;
      --purple:#b5179e;
      --ink:#0f1220;
      --glass: rgba(255,255,255,.82);
      --stroke: rgba(255,255,255,.45);
      --shadow: 0 30px 90px rgba(0,0,0,.28);
      --yes1:#34d399;
      --yes2:#22c55e;
      --no1:#fb7185;
      --no2:#ef4444;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      color:var(--ink);
      overflow:hidden;
      background:
        radial-gradient(1200px 900px at 15% 10%, rgba(255,214,224,.85) 0%, transparent 55%),
        radial-gradient(900px 700px at 85% 20%, rgba(255,229,241,.75) 0%, transparent 58%),
        linear-gradient(135deg, var(--pink), var(--purple));
    }

    /* BIG “I LOVE YOU” BACKGROUND */
    .love-wrap{
      position:fixed; inset:0;
      pointer-events:none;
      z-index:0;
      overflow:hidden;
    }
    .love-giant{
      position:absolute;
      left:50%; top:50%;
      transform: translate(-50%,-50%) rotate(-12deg);
      font-weight:1000;
      letter-spacing:.08em;
      text-transform:uppercase;
      font-size: clamp(64px, 12vw, 140px);
      line-height:1.05;
      color: rgba(255,255,255,.22);
      white-space:nowrap;
      text-shadow:
        0 12px 40px rgba(0,0,0,.10),
        0 2px 0 rgba(255,255,255,.08);
      filter: blur(.0px);
      animation: sway 7s ease-in-out infinite;
    }
    .love-giant span{opacity:.95}
    @keyframes sway{
      0%,100%{ transform: translate(-50%,-50%) rotate(-12deg) translateY(0); }
      50%{ transform: translate(-50%,-50%) rotate(-12deg) translateY(-10px); }
    }

    .love-tile{
      position:absolute; inset:-60px;
      opacity:1;
      transform: rotate(-12deg) scale(1.05);
      background:
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,.00) 0px,
          rgba(255,255,255,.00) 30px,
          rgba(255,255,255,.08) 30px,
          rgba(255,255,255,.08) 32px
        );
    }
    .love-tile::before{
      content:"I LOVE YOU  •  I LOVE YOU  •  I LOVE YOU  •  I LOVE YOU  •  I LOVE YOU  •  I LOVE YOU  •  I LOVE YOU  •  I LOVE YOU  •  I LOVE YOU  •  I LOVE YOU";
      position:absolute; inset:0;
      white-space:pre;
      font-weight:1000;
      letter-spacing:.22em;
      line-height:2.1;
      font-size: clamp(18px, 3.4vw, 42px);
      color: rgba(255,255,255,.33);   /* visible on phones */
      text-transform:uppercase;
      animation: drift 12s linear infinite;
      mix-blend-mode: overlay;
    }
    @keyframes drift{
      from{ transform: translateX(0) translateY(0); }
      to  { transform: translateX(-22%) translateY(-10%); }
    }

    /* floating hearts */
    .hearts{
      position:fixed; inset:0;
      pointer-events:none;
      z-index:1;
      overflow:hidden;
      filter: drop-shadow(0 10px 14px rgba(0,0,0,.18));
    }
    .heart{
      position:absolute;
      transform:translate(-50%,0);
      opacity:.9;
      user-select:none;
      will-change: transform, opacity;
      animation: floatUp linear forwards;
      font-size: clamp(14px, 2.4vw, 28px);
    }
    @keyframes floatUp{
      from{ transform:translate(-50%, 30px) scale(.9); opacity:0; }
      12%{ opacity:.95; }
      to{ transform:translate(-50%, -120vh) scale(1.25); opacity:0; }
    }

    /* main card */
    .wrap{
      position:relative;
      z-index:2;
      height:100%;
      display:grid;
      place-items:center;
      padding:22px;
    }
    .frame{
      width:min(720px, 96vw);
      padding:16px;
      border-radius:34px;
      background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.05));
      border:1px solid rgba(255,255,255,.22);
      backdrop-filter: blur(10px);
      box-shadow: 0 40px 130px rgba(0,0,0,.22);
    }
    .card{
      border-radius:28px;
      background: var(--glass);
      border:1px solid rgba(0,0,0,.06);
      box-shadow: var(--shadow);
      overflow:hidden;
      position:relative;
    }
    .shine{
      position:absolute; inset:-50% -30% auto -30%;
      height:280px;
      background: radial-gradient(closest-side, rgba(255,77,109,.35), transparent 70%);
      pointer-events:none;
    }
    .content{
      padding:26px 22px 18px;
      text-align:center;
      position:relative;
    }
    .badge{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:10px 14px;
      border-radius:999px;
      background: rgba(255, 77, 109, .12);
      border: 1px solid rgba(255, 77, 109, .25);
      font-weight:1000;
      letter-spacing:.2px;
    }
    .title{
      margin:16px 0 8px;
      font-size: clamp(30px, 5vw, 56px);
      line-height:1.02;
      font-weight:1000;
    }
    .subtitle{
      margin:0 auto 16px;
      max-width:56ch;
      font-size: clamp(14px, 2.2vw, 18px);
      opacity:.86;
      line-height:1.45;
    }
    .row{
      display:flex;
      gap:10px;
      justify-content:center;
      flex-wrap:wrap;
      margin:10px 0 6px;
    }
    .pill{
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border-radius:999px;
      background:#fff;
      border:1px solid rgba(0,0,0,.08);
      box-shadow: 0 8px 18px rgba(0,0,0,.08);
      font-weight:900;
    }
    .pill input{
      border:none; outline:none;
      font: inherit;
      width: 12ch;
      text-align:center;
      background:transparent;
    }
    .hint{
      font-size:12px;
      opacity:.62;
      margin-top:6px;
    }

    .actions{
      display:flex;
      justify-content:center;
      gap:14px;
      margin:16px 0 6px;
      min-height:64px;
      position:relative;
    }
    button{
      border:none;
      cursor:pointer;
      font-weight:1000;
      border-radius:18px;
      padding:14px 18px;
      font-size:16px;
      transition: transform .12s ease, filter .12s ease;
      box-shadow: 0 18px 34px rgba(0,0,0,.18);
      user-select:none;
    }
    button:active{ transform: translateY(1px) scale(.99); }
    .yes{
      background: linear-gradient(135deg, var(--yes1), var(--yes2));
      color:white;
    }
    .no{
      background: linear-gradient(135deg, var(--no1), var(--no2));
      color:white;
      position:relative;
    }
    .yes:hover,.no:hover{ filter:brightness(1.02); transform: translateY(-1px); }

    .footer{
      padding:14px 18px 18px;
      display:flex;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
      border-top:1px solid rgba(0,0,0,.06);
      background: rgba(255,255,255,.55);
      font-size:12px;
      opacity:.78;
    }

    /* modal */
    .overlay{
      position:fixed; inset:0;
      display:none;
      place-items:center;
      background: rgba(0,0,0,.40);
      backdrop-filter: blur(8px);
      z-index:50;
      padding:22px;
    }
    .overlay.show{display:grid}
    .modal{
      width:min(680px, 96vw);
      border-radius:28px;
      background:#fff;
      box-shadow: var(--shadow);
      border: 1px solid rgba(0,0,0,.08);
      padding:24px 22px;
      text-align:center;
      position:relative;
      overflow:hidden;
    }
    .modal::before{
      content:"";
      position:absolute; inset:-60px -60px auto -60px;
      height:240px;
      background: radial-gradient(closest-side, rgba(181,23,158,.22), transparent 70%);
      pointer-events:none;
    }
    .big{
      font-size: clamp(30px, 5vw, 52px);
      margin:0 0 10px;
      font-weight:1000;
    }
    .msg{
      margin:0 auto 16px;
      max-width:56ch;
      opacity:.88;
      line-height:1.5;
    }
    .close{
      background:#111827;
      color:white;
      padding:12px 16px;
      border-radius:16px;
    }
  </style>
</head>
<body>
  <div class="love-wrap" aria-hidden="true">
    <div class="love-tile"></div>
    <div class="love-giant"><span>I&nbsp;LOVE&nbsp;YOU</span>&nbsp;💗</div>
  </div>

  <div class="hearts" id="hearts" aria-hidden="true"></div>

  <div class="wrap">
    <div class="frame">
      <div class="card">
        <div class="shine"></div>

        <div class="content">
          <div class="badge">💌 Becher → Denisa</div>

          <h1 class="title">Denisa, will you be my Valentine? 💘</h1>
          <p class="subtitle">
            You are the best 💗 — open this and press “Yes” if you accept my cute Valentine invite.
          </p>

          <div class="row">
            <div class="pill">From: <input id="fromName" value="Becher" /></div>
            <div class="pill">To: <input id="toName" value="Denisa" /></div>
          </div>

          <div class="hint">Tap anywhere for little hearts ✨</div>

          <div class="actions">
            <button class="yes" id="yesBtn">Yes! 💖</button>
            <button class="no" id="noBtn">No 🙈</button>
          </div>
        </div>

        <div class="footer">
          <span>Made with ❤️</span><span>•</span><span>Distance can’t stop cute moments</span>
        </div>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="modal">
      <h2 class="big">YAAAY! 🥰💞</h2>
      <p class="msg" id="msgText"></p>
      <button class="close" id="closeBtn">Send me a kiss 😘</button>
    </div>
  </div>

  <script>
    const heartsLayer = document.getElementById("hearts");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn  = document.getElementById("noBtn");
    const overlay = document.getElementById("overlay");
    const closeBtn = document.getElementById("closeBtn");
    const fromName = document.getElementById("fromName");
    const toName = document.getElementById("toName");
    const msgText = document.getElementById("msgText");

    const heartChars = ["💗","💖","💘","💝","💞","💕","❤️","🫶"];

    function spawnHeart({x=null, y=null, big=false} = {}) {
      const el = document.createElement("div");
      el.className = "heart";
      el.textContent = heartChars[Math.floor(Math.random() * heartChars.length)];

      const left = x ?? (Math.random() * window.innerWidth);
      const startY = y ?? (window.innerHeight + 30);

      el.style.left = left + "px";
      el.style.top  = startY + "px";
      el.style.fontSize = big ? "34px" : "";

      const dur = (big ? 3.7 : 5.2) + Math.random() * 3.0;
      el.style.animationDuration = dur + "s";
      el.style.opacity = (0.55 + Math.random() * 0.4).toFixed(2);

      heartsLayer.appendChild(el);
      setTimeout(() => el.remove(), dur * 1000 + 250);
    }

    setInterval(() => spawnHeart(), 220);

    function heartBurst(cx, cy) {
      for (let i = 0; i < 26; i++) {
        setTimeout(() => {
          const jx = cx + (Math.random() - 0.5) * 260;
          const jy = cy + (Math.random() - 0.5) * 110;
          spawnHeart({ x: jx, y: jy, big: Math.random() > 0.72 });
        }, i * 16);
      }
    }

    function moveNoButton() {
      const padding = 14;
      const rect = noBtn.getBoundingClientRect();
      const maxX = window.innerWidth - rect.width - padding;
      const maxY = window.innerHeight - rect.height - padding;

      const x = Math.max(padding, Math.random() * maxX);
      const y = Math.max(padding, Math.random() * maxY);

      noBtn.style.position = "fixed";
      noBtn.style.left = x + "px";
      noBtn.style.top  = y + "px";
      noBtn.style.zIndex = 40;
    }
    noBtn.addEventListener("mouseenter", moveNoButton);
    noBtn.addEventListener("touchstart", (e) => { e.preventDefault(); moveNoButton(); }, {passive:false});
    noBtn.addEventListener("click", moveNoButton);

    yesBtn.addEventListener("click", () => {
      const r = yesBtn.getBoundingClientRect();
      heartBurst(r.left + r.width/2, r.top + r.height/2);

      const from = (fromName.value || "Becher").trim();
      const to   = (toName.value || "Denisa").trim();
      msgText.textContent =
        `${to}, you are the best 💗. Happy Valentine’s Day! ` +
        `You just made ${from} super happy 💘`;

      overlay.classList.add("show");
      overlay.setAttribute("aria-hidden", "false");
    });

    closeBtn.addEventListener("click", () => {
      overlay.classList.remove("show");
      overlay.setAttribute("aria-hidden", "true");
      heartBurst(window.innerWidth/2, window.innerHeight/2);
    });
    overlay.addEventListener("click", (e) => { if (e.target === overlay) closeBtn.click(); });

    window.addEventListener("click", (e) => {
      if (!overlay.classList.contains("show")) {
        spawnHeart({ x: e.clientX, y: e.clientY, big: Math.random() > 0.82 });
      }
    }, {capture:true});
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Denisa 💘</title>

<style>
body{
  margin:0;
  height:100vh;
  font-family: system-ui;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:linear-gradient(135deg,#ff4d6d,#b5179e,#7c3aed);
  color:#111;
}

/* BACKGROUND TEXT */
.bg{
 position:fixed; inset:-100px;
 transform:rotate(-15deg);
 pointer-events:none;
 opacity:.35;
 font-weight:900;
 letter-spacing:.18em;
 line-height:2;
 font-size:clamp(20px,4vw,48px);
 color:white;
 animation:move 12s linear infinite;
}
@keyframes move{
 from{transform:rotate(-15deg) translate(0,0);}
 to{transform:rotate(-15deg) translate(-18%,-10%);}
}

/* CARD */
.card{
 background:rgba(255,255,255,.85);
 padding:30px;
 border-radius:28px;
 text-align:center;
 width:min(420px,90vw);
 box-shadow:0 30px 90px rgba(0,0,0,.35);
}

h1{margin:0 0 10px;font-size:28px}
p{opacity:.7}

button{
 border:none;
 padding:14px 20px;
 margin:10px;
 font-size:16px;
 border-radius:14px;
 cursor:pointer;
 font-weight:700;
}

.yes{background:#22c55e;color:white}
.no{background:#ef4444;color:white}

/* MODAL */
.overlay{
 position:fixed; inset:0;
 background:rgba(0,0,0,.5);
 backdrop-filter:blur(8px);
 display:none;
 align-items:center;
 justify-content:center;
}

.modal{
 background:white;
 padding:26px;
 border-radius:26px;
 width:min(500px,92vw);
 text-align:center;
}

#letter{
 white-space:pre-line;
 font-size:18px;
 line-height:1.5;
}
</style>
</head>

<body>

<div class="bg">
I LOVE U SO MUCH • I LOVE U SO MUCH • I LOVE U SO MUCH • I LOVE U SO MUCH •
I LOVE U SO MUCH • I LOVE U SO MUCH • I LOVE U SO MUCH • I LOVE U SO MUCH •
</div>

<div class="card">
<h1>Denisa, will you be my Valentine? 💘</h1>
<p>You are the best 💗</p>

<button class="yes" id="yes">Yes 💖</button>
<button class="no" id="no">No 🙈</button>
</div>

<div class="overlay" id="overlay">
<div class="modal">
<h2>🥰</h2>
<div id="letter"></div>
</div>
</div>

<script>
/* NO button dodge */
const noBtn=document.getElementById("no");
noBtn.addEventListener("mouseover",()=>{
 noBtn.style.position="fixed";
 noBtn.style.left=Math.random()*80+"vw";
 noBtn.style.top=Math.random()*80+"vh";
});

/* MESSAGE */
const message=`Denisa 💗

You are my beloved girlfriend 💕💕
but you are also my best friend 💑

my love ♥️
my heart 💗🤍
my gift 🎁
my future ♾️
my motivation 🤩
my princess 👑
my home 😍
my safe place 😘

I love you so much and happy Valentine Day ma baby 🥰

— Becher 💘`;

/* TYPEWRITER EFFECT */
const overlay=document.getElementById("overlay");
const letter=document.getElementById("letter");

document.getElementById("yes").onclick=()=>{
 overlay.style.display="flex";
 letter.textContent="";
 let i=0;

 function type(){
  if(i<message.length){
   letter.textContent+=message[i];
   i++;
   setTimeout(type,25);
  }
 }
 type();
};
</script>

</body>
</html>
